[project]
name = "audit-validation-finale"
version = "1.0.0"
description = "Audit de la colonne « Validation finale » des fichiers audit SNA, rapport HTML et mise à jour en masse des ID erreur"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "openpyxl>=3.1",
    "pywin32>=306 ; sys_platform == 'win32'",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# faulthandler signale à tort l'exception COM RPC_E_DISCONNECTED (gérée par
# Windows) à la fermeture d'Excel dans tests/moteur_sna/test_excel_com.py.
addopts = "-p no:faulthandler"
markers = [
    "excel: tests pilotant une instance Excel réelle (COM)",
]
